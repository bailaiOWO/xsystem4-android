name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ABI_NAMES: arm64-v8a armeabi-v7a x86_64
      ANDROID_API_LEVEL: 28

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Deps
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Apply engine patches (Sengoku Rance CN HLL fixes)
      run: |
        cd $GITHUB_WORKSPACE/xsystem4
        for p in ../patches/*.patch; do
          echo "Applying $p"
          git apply "$p"
        done

    - name: Apply GBK Patch
      run: |
        cd $GITHUB_WORKSPACE/xsystem4/subprojects/libsys4

        # 1. Generate static GBK to UCS2 lookup table (bypassing Android bionic iconv limitations)
        python3 -c '
        with open("src/gbk_table.h", "w") as f:
            f.write("#include <stdint.h>\nstatic const uint16_t gbk_to_ucs2[126][190] = {\n")
            for b1 in range(0x81, 0xFF):
                row = []
                for b2 in range(0x40, 0xFF):
                    if b2 == 0x7F:
                        continue
                    try:
                        char = bytes([b1, b2]).decode("gbk")
                        row.append(f"0x{ord(char):04x}")
                    except UnicodeDecodeError:
                        row.append("0x0000")
                f.write("  { " + ", ".join(row) + " },\n")
            f.write("};\n")
        '

        # 2. Expand 2-byte boundary
        sed -i 's/#define SJIS_2BYTE(b) ( ((b) & 0xe0) == 0x80 || ((b) & 0xe0) == 0xe0 )/#define SJIS_2BYTE(b) (((uint8_t)(b) >= 0x81 \&\& (uint8_t)(b) <= 0xfe))/' include/system4/utfsjis.h

        # 3. Patch utfsjis.c to directly use the static GBK lookup table
        python3 -c '
        with open("src/utfsjis.c", "r") as f:
            c = f.read()
        target = "char *sjis_char2unicode(const char *_src, int *dst)\n{\n\tconst uint8_t *src = (const uint8_t*)_src;"
        replacement = """#include "gbk_table.h"

        char *sjis_char2unicode(const char *_src, int *dst)
        {
        \tconst uint8_t *src = (const uint8_t*)_src;
        \tif (*src <= 0x7f) {
        \t\t*dst = *src;
        \t\treturn (char*)src + 1;
        \t}
        \tuint8_t b1 = *src;
        \tuint8_t b2 = *(src + 1);
        \tif (b1 >= 0x81 && b1 <= 0xfe && b2 >= 0x40 && b2 <= 0xfe && b2 != 0x7f) {
        \t\tint col = b2 - 0x40 - (b2 > 0x7f ? 1 : 0);
        \t\tuint16_t ucs = gbk_to_ucs2[b1 - 0x81][col];
        \t\tif (ucs != 0) {
        \t\t\t*dst = (int)ucs;
        \t\t\treturn (char*)src + 2;
        \t\t}
        \t}"""
        assert target in c, "target in utfsjis.c not found"
        c = c.replace(target, replacement, 1)
        with open("src/utfsjis.c", "w") as f:
            f.write(c)
        '

        # 4. Patch text.c to bypass AFA.fnl bitmap font and force HanaMinA TTF
        cd $GITHUB_WORKSPACE/xsystem4
        python3 -c '
        with open("src/text.c", "r") as f:
            c = f.read()
        c = c.replace(
            "#define DEFAULT_FONT_GOTHIC \"fonts/VL-Gothic-Regular.ttf\"",
            "#define DEFAULT_FONT_GOTHIC \"fonts/HanaMinA.ttf\""
        )
        target = "static struct font *get_font(unsigned face)\n{\n\tif (face > 255) {\n\t\tface -= 256;\n\t\tif (face >= MAX_FNL_FONTS || !font_fnl[face]) {\n\t\t\tWARNING(\"Invalid fnl face: %u\", face);\n\t\t\treturn font_ttf[0];\n\t\t}\n\t\treturn font_fnl[face];\n\t}\n\tif (face > 1)\n\t\treturn font_ttf[0];\n\treturn font_ttf[face];\n}"
        replacement = "static struct font *get_font(unsigned face)\n{\n\tif (face > 255) {\n\t\tface -= 256;\n\t\tif (face >= MAX_FNL_FONTS || !font_fnl[face]) {\n\t\t\tWARNING(\"Invalid fnl face: %u\", face);\n\t\t\treturn font_ttf[FONT_MINCHO];\n\t\t}\n\t\treturn font_fnl[face];\n\t}\n\t// CN: force HanaMinA for TTF faces (keep FNL bitmap fonts working)\n\treturn font_ttf[FONT_MINCHO];\n}"
        assert target in c, "target in text.c not found"
        c = c.replace(target, replacement, 1)
        with open("src/text.c", "w") as f:
            f.write(c)
        '

        # 5. Patch input.c to lock mouse_focus on Android so hover tooltips always work
        python3 -c '
        with open("src/input.c", "r") as f:
            c = f.read()
        target = "case SDL_WINDOWEVENT_LEAVE:\n\t\tmouse_focus = false;\n\t\tbreak;"
        replacement = "case SDL_WINDOWEVENT_LEAVE:\n#ifndef __ANDROID__\n\t\tmouse_focus = false;\n#endif\n\t\tbreak;"
        assert target in c, "target in input.c not found"
        c = c.replace(target, replacement, 1)
        with open("src/input.c", "w") as f:
            f.write(c)
        '

    - name: Native Build
      run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME ./build-shared-libs.sh

    - name: Setup Fixed Debug Keystore
      run: |
        mkdir -p ~/.android
        echo "" | base64 -d > ~/.android/debug.keystore

    - name: App Build
      run: |
        cd project
        ./gradlew assembleDebug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xsystem4-chinese-debug-apk
        path: project/app/build/outputs/apk/debug/app-debug.apk
